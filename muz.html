  <script>
    const playlistsPage = document.getElementById('playlistsPage');
    const tracksPage = document.getElementById('tracksPage');
    const playlistContents = document.querySelectorAll('.playlist-content');

    function openPlaylist(playlistId) {
      playlistsPage.classList.add('hidden');
      tracksPage.classList.remove('hidden');

      playlistContents.forEach(content => {
        content.classList.add('hidden');
      });

      document.getElementById(playlistId).classList.remove('hidden');

      window.scrollTo({
        top: 0,
        behavior: 'smooth'
      });
    }

    function goBack() {
      tracksPage.classList.add('hidden');
      playlistsPage.classList.remove('hidden');

      playlistContents.forEach(content => {
        content.classList.add('hidden');
      });

      window.scrollTo({
        top: 0,
        behavior: 'smooth'
      });
    }
  </script>
