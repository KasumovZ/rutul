  <style>
    .playlist-btn {
      display: flex;
      width: 100%;
      align-items: center;
      gap: 12px;
      border-radius: 16px;
      background: #181818;
      padding: 12px;
      text-align: left;
      transition: transform .15s ease, background .15s ease;
    }

    .playlist-btn:active {
      transform: scale(.985);
      background: #222;
    }

    .playlist-cover {
      display: flex;
      height: 48px;
      width: 48px;
      flex-shrink: 0;
      align-items: center;
      justify-content: center;
      border-radius: 12px;
      background: linear-gradient(135deg, #facc15, #f59e0b);
      color: #111;
      font-size: 24px;
      font-weight: 900;
      line-height: 1;
    }

    .ym-frame {
      display: block;
      width: 100%;
      height: calc(100dvh - 140px);
      min-height: 520px;
      border: none;
      border-radius: 16px;
      background: #181818;
    }

    @media (max-width: 360px) {
      .ym-frame {
        min-height: 480px;
      }
    }
  </style>

  <script>
    const playlistsPage = document.getElementById('playlistsPage');
    const tracksPage = document.getElementById('tracksPage');
    const playlistContents = document.querySelectorAll('.playlist-content');
    const playlistName = document.getElementById('playlistName');

    const names = {
      playlist1: 'Вели Шахбанов',
      playlist2: 'Шафи Ибрагимов',
      playlist3: 'Мевлидин, Ханзда, Зарема Довудова',
      playlist4: 'Кристина Азизханова',
      playlist5: 'Лезгинка и рутульские зажигательные',
      playlist6: 'Эсмира',
      playlist7: 'Гюльназ Гаджикурбанова',
      playlist8: 'Бахтавар'
    };

    function openPlaylist(playlistId) {
      playlistsPage.classList.add('hidden');
      tracksPage.classList.remove('hidden');

      playlistContents.forEach(content => content.classList.add('hidden'));

      document.getElementById(playlistId).classList.remove('hidden');
      playlistName.textContent = names[playlistId] || 'Плейлист';

      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function goBack() {
      tracksPage.classList.add('hidden');
      playlistsPage.classList.remove('hidden');

      playlistContents.forEach(content => content.classList.add('hidden'));

      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
  </script>
